# Hermes plugin manifest · habit_reflector
#
# 跟 Hermes 现有的 6 个 memory plugin (honcho, retaindb, supermemory, ...) 同等地位.
# Hermes 启动时按 plugins.memory.habit_reflector.enabled 来决定是否加载.
#
# 这就是路 B 跟路 A 的关键差别——路 A 在 ~/.hermes/hooks/ 下挂外挂 cron;
# 路 B 在 hermes-agent 仓库 plugins/memory/ 下作为<b>官方 provider</b>注册.

name: habit_reflector
version: 0.1.0
description: |
  Retrospective memory provider that distills 30 days of conversation history
  into stable user habits, auto-promoted into USER.md.
  Implements the new RetrospectiveProvider abstraction.

author: AlexZWANG1
license: MIT
homepage: https://github.com/AlexZWANG1/hermes-habit-reflector

# 这个 plugin 实现哪种 provider 抽象?
provider_type: retrospective_memory       # 路 B 改动 1 新加的子类型

# 入口
entry_point: plugins.memory.habit_reflector:HabitReflector

# 依赖
requires:
  - anthropic >=0.40.0

# Hermes 主 config.yaml 里用户怎么配
config_schema:
  enabled:
    type: bool
    default: false                          # 默认关闭, 用户主动开
    description: 是否启用 habit_reflector

  distiller_model:
    type: str
    default: "claude-haiku-4-5"
    description: 蒸馏用的小模型

  window_days:
    type: int
    default: 30
    description: 回顾过去 N 天的 messages

  auto_promote_threshold:
    type: float
    default: 0.85
    description: 自动写入 USER.md 的置信度阈值
